apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: nginx-web-lb
  template:
    metadata:
      labels:
        app: nginx-web-lb
    spec:
      containers:
        - name: nginx-container
          image: jx7789/nginx:0611fc95dc8b746cd3dc5bde119ed3f33ac0fe21
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  annotations:
    # AWS Load Balancer Controller를 사용하도록 지정
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    # NodePort를 거치지 않고 Pod IP(10.0.x.x)로 직접 라우팅 (보안그룹 문제 해결)
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    # 인터넷에서 접속 가능하도록 퍼블릭 서브넷에 생성
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: nginx-web-lb
  ports: 
    - protocol: TCP
      port: 80
      targetPort: 80